[package]
name = "taphttp-types"
version = "0.6.0"
edition = "2021"
rust-version = "1.87"
description = "Traffic log types shared by taphttp and the tools that consume its output"
license = "MIT"

# Deliberately tiny: consumers (spall, future taphttp-* tools) depend on this
# instead of mirroring TrafficEntry by hand, so it must not drag in the proxy.
[dependencies]
serde = { version = "1", features = ["derive"] }
jiff = { version = "0.2.39", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1"
