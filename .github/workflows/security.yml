# Security gates from cschooley/sec-actions, in audit mode
# (fail_on_findings: false) until the baseline is triaged. Results go to the
# repo's Security tab (code scanning, one category per tool) and as artifacts.
# GitHub-native CodeQL, secret scanning with push protection and Dependabot
# alerts are enabled in the repo settings, not here.
#
# Scanner versions are pinned (each at least two weeks old when chosen);
# sec-actions would otherwise install the latest release at run time.
name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: new advisories land against code nobody touched
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history
          persist-credentials: false
      - uses: cschooley/sec-actions/actions/gitleaks@750b45e160b1e2350c6c7257bcdc366cf681104c # main, 2026-08-10
        with:
          version: "8.30.1"
          fail_on_findings: "false"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('gitleaks.sarif') != ''
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The sec-actions semgrep action has no version input and installs the
      # latest; preinstalling a pinned one makes it skip that.
      - run: pipx install semgrep==1.184.0
      - uses: cschooley/sec-actions/actions/semgrep@750b45e160b1e2350c6c7257bcdc366cf681104c # main, 2026-08-10
        with:
          config: auto
          fail_on_findings: "false"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    name: Dependencies (OSV-Scanner, Cargo.lock)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cschooley/sec-actions/actions/osv-scanner@750b45e160b1e2350c6c7257bcdc366cf681104c # main, 2026-08-10
        with:
          version: "2.7.0"
          format: sarif
          output_file: osv.sarif
          config: osv-scanner.toml # dated, reasoned suppressions only
          fail_on_findings: "false"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('osv.sarif') != ''
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  sbom:
    name: SBOM + licenses (syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cschooley/sec-actions/actions/syft@750b45e160b1e2350c6c7257bcdc366cf681104c # main, 2026-08-10
        with:
          version: "1.57.0"
          target: "dir:."
          output_file: sbom.spdx.json
          check_licenses: "true"
          deny_licenses: "GPL-2.0-only,GPL-3.0-only,AGPL-3.0-only"
          fail_on_findings: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom
          path: sbom.spdx.json

  vuln-sbom:
    name: CVEs in the SBOM (grype)
    runs-on: ubuntu-latest
    needs: sbom
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - uses: cschooley/sec-actions/actions/grype@750b45e160b1e2350c6c7257bcdc366cf681104c # main, 2026-08-10
        with:
          version: "0.121.2"
          target: sbom.spdx.json
          output_file: grype-sbom.sarif
          severity_cutoff: medium
          fail_on_findings: "false"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('grype-sbom.sarif') != ''
        with:
          sarif_file: grype-sbom.sarif
          category: grype-sbom

  vuln-image:
    name: CVEs in the taphttp image (grype)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t taphttp:scan .
      - uses: cschooley/sec-actions/actions/grype@750b45e160b1e2350c6c7257bcdc366cf681104c # main, 2026-08-10
        with:
          version: "0.121.2"
          target: "docker:taphttp:scan"
          output_file: grype-image.sarif
          severity_cutoff: medium
          fail_on_findings: "false"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('grype-image.sarif') != ''
        with:
          sarif_file: grype-image.sarif
          category: grype-image
