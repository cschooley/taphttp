[package]
name = "taphttp"
version = "0.8.0"
edition = "2021"
description = "Headless TLS-terminating MITM proxy for HTTP traffic inspection"
license = "MIT"

[workspace]
members = [".", "crates/taphttp-types"]
# So plain `cargo test` / `cargo clippy` cover the shared types crate too.
default-members = [".", "crates/taphttp-types"]

[[bin]]
name = "taphttp"
path = "src/main.rs"

[dependencies]
taphttp-types = { path = "crates/taphttp-types", version = "0.7.0" }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18.1"
pem = "4.0.0"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
hyper-rustls = { version = "0.27", features = ["http1", "http2", "native-tokio", "ring"] }
webpki-roots = "0.26"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }

clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
axum = { version = "0.8.9", features = ["ws"] }
ring = "0.17"
tower = { version = "0.5.3", features = ["util"] }
futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
